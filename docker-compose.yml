services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voxagent
      POSTGRES_USER: voxagent
      POSTGRES_PASSWORD: voxagent
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxagent -d voxagent"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://voxagent:voxagent@db:5432/voxagent
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
